
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCampus | Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background: linear-gradient(135deg,#0f172a,#3730a3,#7c3aed);
}

.card {
    width: 100%;
    max-width: 440px;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 20px 60px #0005;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 12px;
    border-radius: 18px;
    background: linear-gradient(135deg,#2563eb,#9333ea);
    color: white;
    display: grid;
    place-items: center;
    font-size: 30px;
}

h1 {
    color: #1e1b4b;
    font-size: 28px;
}

.logo p {
    color: #64748b;
    margin-top: 8px;
    font-size: 14px;
}

label {
    display: block;
    margin: 17px 0 7px;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: #f8fafc;
}

input:focus, select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px #6366f122;
}

button.login-btn {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(100deg,#2563eb,#7c3aed);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.login-btn:hover {
    opacity: .9;
}

.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: auto;
    margin: 0;
    padding: 10px 20px;
    background: white;
    color: #3730a3;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
}

.back-btn:hover {
    background: #e0e7ff;
}

.flash {
    background: #fee2e2;
    color: #991b1b;
    padding: 11px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #94a3b8;
    margin-top: 25px;
    font-size: 12px;
}

.register-link {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
}

.register-link a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

@media(max-width:500px) {
    .card {
        padding: 25px;
    }

    .back-btn {
        top: 12px;
        left: 12px;
    }
}
</style>
</head>

<body>

<button type="button" class="back-btn" onclick="goBack()">
    ← Back
</button>

<div class="card">

    <div class="logo">
        <div class="logo-icon">🎓</div>
        <h1>SmartCampus</h1>
        <p>AI-Based Campus Complaint Management System</p>
    </div>

    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}

    <form method="POST">

        <label>Select Your Role</label>
        <select name="role" id="role" required>
            <option value="Student">Student</option>
            <option value="Department Head">HOD</option>
            <option value="Principal">Principal</option>
            <option value="Admin">Admin</option>
        </select>

        <label>Username / Email</label>
        <input type="text" name="username"
               placeholder="Enter username or email" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit" class="login-btn">
            Login to SmartCampus
        </button>

    </form>

    <div class="register-link">
        New Student?
        <a href="{{ url_for('student_register') }}">Create Account</a>
    </div>

    <div class="footer">
        SmartCampus © 2026 | Secure Campus Portal
    </div>

</div>

<script>
function goBack() {
    if (
        document.referrer &&
        new URL(document.referrer).origin === window.location.origin
    ) {
        history.back();
    } else {
        window.location.href = "/";
    }
}
</script>

</body>
</html>
