<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration | SmartCampus</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#0f172a,#2563eb);min-height:100vh;display:grid;place-items:center;margin:0}
.card{background:white;padding:30px;border-radius:16px;width:min(360px,85vw)}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px}
input{border:1px solid #cbd5e1}button{background:#2563eb;color:white;border:0;cursor:pointer}
a{color:#2563eb}
</style>
</head>
<body>
<div class="card">
<h2>Student Registration</h2>
{% for message in get_flashed_messages() %}<p>{{ message }}</p>{% endfor %}
<form method="POST">
<input name="name" placeholder="Full name" required>
<input type="email" name="email" placeholder="Email address" required>
<input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required>
<input name="department" placeholder="Department (e.g. AIML)" required>
<button type="submit">Create Student Account</button>
</form>
<p><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
<script>
function goBack() {
    if (
        document.referrer &&
        new URL(document.referrer).origin === window.location.origin
    ) {
        history.back();
    } else {
        window.location.href = "/";
    }
}
</script>
</body>
<button type="button" class="back-btn" onclick="goBack()">
    ← Back
</button>
</html>
